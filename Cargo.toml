[package]
name = "rustle"
version = "0.1.0"
edition = "2024"

[dependencies]
libstrawberry = { version = "1.2.0", features = ["notifications"] }
mdns-sd = "0.13.11"
tokio = { version = "1.47.0", features = ["full"] }
env_logger = "0.11.5"
whoami = "1.5.2"
lazy_static = "1.5.0"
serde_yaml = "0.9.34"
serde = { version = "1.0.219", features = ["derive"] }
directories = "6.0.0"
shellexpand = "3.1.1"
egui = "0.32.0"
eframe = "0.32.0"
serde = { version = "1.0.228", features = ["derive"] }
directories = "6.0.0"
shellexpand = "3.1.2"
egui = "0.33.3"
eframe = "0.33.3"
ipnet = "2.12.0"
image = "0.25.10"
futures = "0.3.32"
